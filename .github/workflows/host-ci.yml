name: Host CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69ea43b2e2ff601ac7d1334b8134ab1d1ae # v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Configure CMake (CUDA disabled)
        run: cmake -S . -B build -DVANTA_ENABLE_CUDA=OFF

      - name: Build
        run: cmake --build build

      - name: Run host tests
        run: ctest --test-dir build --output-on-failure
